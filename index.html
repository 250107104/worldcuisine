<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WorldCuisine — The world is served</title>
  <meta name="description" content="Discover cultures, traditions and stories through food.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
</head>
<body data-page="home">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main">
    <!-- HERO -->
    <section class="hero container">
      <div class="hero-text">
        <p class="eyebrow">Food · Culture · Stories</p>
        <h1>The world is <em>served.</em></h1>
        <p class="hero-sub">Discover cultures, traditions and stories through food.</p>
        <a class="btn" href="#map">Explore</a>
      </div>
      <div class="hero-photo photo">
        <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1000&q=70"
             alt="A table full of colourful dishes" onerror="this.classList.add('img-failed')">
      </div>
    </section>

    <!-- MAP -->
    <section id="map" class="map-section">
      <div class="container">
        <h2 class="section-title">Explore the world map</h2>
        <p class="section-lead">Click a highlighted country to meet its cuisine.</p>
        <div class="map-layout">
          <div id="map-container" class="map-box" aria-label="Interactive world map"></div>
          <aside id="country-panel" class="country-panel" aria-live="polite"></aside>
        </div>
      </div>
    </section>

    <!-- POPULAR DISHES -->
    <section class="container section">
      <h2 class="section-title">Popular dishes</h2>
      <div id="popular-dishes" class="card-grid"></div>
    </section>

    <!-- TRENDING CUISINES -->
    <section class="trending section">
      <div class="container">
        <h2 class="section-title">Trending cuisines</h2>
        <div id="trending-cuisines" class="chip-grid"></div>
      </div>
    </section>

    <!-- DISCOVER -->
    <section class="container section">
      <h2 class="section-title">Discover something new</h2>
      <div id="discover" class="discover"></div>
      <div class="random-box">
        <button id="random-dish-btn" class="btn" type="button">Random dish</button>
        <div id="random-dish-result" aria-live="polite"></div>
      </div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/home.js"></script>
</body>
</html>
