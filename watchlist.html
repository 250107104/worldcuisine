<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Watchlist — WorldCuisine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,600;0,800;1,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/user.css">
</head>
<body data-page="watchlist">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header" class="site-header"></header>

  <main id="main" class="container">
    <section class="page-head">
      <p class="eyebrow">Your collection</p>
      <h1>My <em>watchlist</em></h1>
    </section>

    <section class="user-section" aria-labelledby="wl-title">
      <div class="section-bar">
        <h2 id="wl-title">Watchlist <span id="wl-count" class="count"></span></h2>
        <div class="form-field inline">
          <label for="wl-sort">Sort by</label>
          <select id="wl-sort">
            <option value="newest">Recently added</option>
            <option value="oldest">Oldest first</option>
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
            <option value="not-tried">Not tried first</option>
            <option value="rating">Highest rated</option>
          </select>
        </div>
      </div>
      <div id="watchlist-grid" class="card-grid"></div>
    </section>

    <section class="user-section" aria-labelledby="fav-title">
      <div class="section-bar"><h2 id="fav-title">Favorites <span id="fav-count" class="count"></span></h2></div>
      <div id="favorites-grid" class="card-grid"></div>
    </section>
  </main>

  <footer id="site-footer" class="site-footer"></footer>
  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/watchlist.js"></script>
</body>
</html>
